name: Build APK Android
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "y" | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p android assembleDebug
      - name: Prepare APK Asset
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RuangUji-CBT-Siswa.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RuangUji-APK-debug
          path: RuangUji-CBT-Siswa.apk
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: RuangUji CBT Siswa v1.0.0
          body: Rilis resmi Aplikasi Android RuangUji CBT Exambro khusus Siswa. Unduh file APK di bawah ini dan pasang pada HP murid.
          files: RuangUji-CBT-Siswa.apk
